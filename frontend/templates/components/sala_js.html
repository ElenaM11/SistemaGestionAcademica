<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.9.1/dist/livekit-client.umd.min.js"></script>
<script>
(function () {
    var sala = document.getElementById('sala');
    if (!sala) { return; }
    var $ = function (id) { return document.getElementById(id); };

    var POR_PAGINA = 6;
    var AUTO_SEGUIR_HABLANTE = true;
    var COOLDOWN_NAV_MS = 4000;

    var estado = $('estadoAudio'), contador = $('contadorParticipantes'), grilla = $('grillaParticipantes');
    var panel = $('listaParticipantes'), tituloPanel = $('tituloParticipantes'), audios = $('audios');
    var pantalla = $('pantallaCompartida'), aviso = $('avisoSala');
    var btnMic = $('btnMic'), btnCamara = $('btnCamara'), btnPantalla = $('btnPantalla'), btnFull = $('btnFullscreen');
    var btnAudio = $('btnAudio'), badge = $('badgeParticipantes');
    var pager = $('controlesPaginacion'), pagerInfo = $('infoPagina'), btnPrev = $('btnPrevPagina'), btnNext = $('btnNextPagina');

    var puedeCompartir = sala.dataset.puedeCompartir === 'true';
    var room = null, saliendo = false, tarjetas = {};
    var paginaActual = 0, ultimaNavManual = 0;

    function mostrarAviso(texto) { aviso.textContent = texto; aviso.classList.remove('d-none'); }
    function el(tag, clase, texto) {
        var e = document.createElement(tag);
        if (clase) { e.className = clase; }
        if (texto !== undefined) { e.textContent = texto; }
        return e;
    }
    function icono(btn, icon, etiqueta, estadoBtn) {
        btn.querySelector('i').className = 'bi ' + icon;
        btn.setAttribute('aria-label', etiqueta); btn.title = etiqueta;
        btn.classList.toggle('call-btn--off', estadoBtn === 'off');
        btn.classList.toggle('call-btn--on', estadoBtn === 'on');
    }

    if (btnFull) {
        if (!document.documentElement.requestFullscreen) { btnFull.classList.add('d-none'); }
        btnFull.addEventListener('click', function () {
            if (document.fullscreenElement) { document.exitFullscreen(); return; }
            document.documentElement.requestFullscreen().catch(function () { mostrarAviso('Tu navegador no permitió la pantalla completa.'); });
        });
        document.addEventListener('fullscreenchange', function () {
            var activa = !!document.fullscreenElement;
            document.documentElement.classList.toggle('sala-pantalla-completa', activa);
            if (activa) { icono(btnFull, 'bi-fullscreen-exit', 'Salir de pantalla completa (Esc)', 'on'); }
            else { icono(btnFull, 'bi-fullscreen', 'Pantalla completa', ''); }
        });
    }

    var crono = $('cronometro'), inicio = crono ? Date.parse(crono.dataset.inicio) : NaN;
    function dos(n) { return String(n).padStart(2, '0'); }
    function tick() {
        var s = Math.max(0, Math.floor((Date.now() - inicio) / 1000));
        crono.textContent = dos(Math.floor(s / 3600)) + ':' + dos(Math.floor(s % 3600 / 60)) + ':' + dos(s % 60);
    }
    if (crono && !isNaN(inicio)) { tick(); setInterval(tick, 1000); }

    if (!window.LivekitClient) {
        mostrarAviso('No se pudo cargar el componente de llamadas. Revisa tu conexión.');
        estado.textContent = 'Sin conexión';
        return;
    }
    var LK = window.LivekitClient;

    function iniciales(nombre) {
        var t = nombre.trim().split(/\s+/);
        return ((t[0] || '')[0] || '').toUpperCase() + ((t[1] || '')[0] || '').toUpperCase();
    }
    function rolDe(p) { try { return JSON.parse(p.metadata || '{}').rol || 'Estudiante'; } catch (e) { return 'Estudiante'; } }
    function vozDe(p) {
        if (!p.isMicrophoneEnabled) { return ['Silenciado', '']; }
        return p.isSpeaking ? ['Hablando', 'pill--ok'] : ['Micrófono activo', ''];
    }
    function todos() {
        var lista = [room.localParticipant];
        room.remoteParticipants.forEach(function (p) { lista.push(p); });
        return lista.sort(function (a, b) { return (rolDe(a) === 'Docente' ? 0 : 1) - (rolDe(b) === 'Docente' ? 0 : 1); });
    }
    function fila(p) {
        var nombre = p.name || p.identity, voz = vozDe(p);
        var f = el('div', 'participant-row');
        var av = el('div', 'avatar avatar--sm', iniciales(nombre)); av.setAttribute('aria-hidden', 'true');
        var info = el('div', 'participant-info');
        info.appendChild(el('div', '', nombre));
        info.appendChild(el('small', 'text-muted', rolDe(p)));
        f.appendChild(av); f.appendChild(info); f.appendChild(el('span', 'pill ' + voz[1], voz[0]));
        return f;
    }

    function crearTarjeta() {
        var video = el('video', 'tile-video');
        video.autoplay = true; video.muted = true; video.playsInline = true;
        var t = { raiz: el('article', 'participant-card'), video: video, avatar: el('div', 'avatar avatar--lg'),
                  nombre: el('div', 'participant-name'), rol: el('div', 'participant-role'), pill: el('span', 'pill'), camara: null };
        t.avatar.setAttribute('aria-hidden', 'true');
        [t.video, t.avatar, t.nombre, t.rol, t.pill].forEach(function (n) { t.raiz.appendChild(n); });
        return t;
    }
    function quitarTarjeta(id) {
        var t = tarjetas[id];
        if (!t) { return; }
        if (t.camara) { t.camara.detach(t.video); }
        t.raiz.remove();
        delete tarjetas[id];
    }
    function actualizarTarjeta(p, t) {
        var nombre = p.name || p.identity, voz = vozDe(p), local = p === room.localParticipant;
        t.avatar.textContent = iniciales(nombre);
        t.nombre.textContent = nombre + (local ? ' (tú)' : '');
        t.rol.textContent = rolDe(p);
        t.pill.className = 'pill ' + voz[1]; t.pill.textContent = voz[0];
        t.raiz.classList.toggle('is-speaking', p.isSpeaking);
        t.raiz.classList.toggle('is-local', local);
        var pub = p.getTrackPublication(LK.Track.Source.Camera);
        var track = pub && pub.track && !pub.isMuted ? pub.track : null;
        if (track !== t.camara) {
            if (t.camara) { t.camara.detach(t.video); }
            if (track) { track.attach(t.video); }
            t.camara = track;
            t.raiz.classList.toggle('has-video', !!track);
        }
    }
    function etiquetas() {
        var lp = room.localParticipant;
        if (btnMic) {
            if (lp.isMicrophoneEnabled) { icono(btnMic, 'bi-mic-fill', 'Silenciar micrófono', ''); }
            else { icono(btnMic, 'bi-mic-mute-fill', 'Activar micrófono', 'off'); }
        }
        if (btnCamara) {
            if (lp.isCameraEnabled) { icono(btnCamara, 'bi-camera-video-fill', 'Apagar cámara', ''); }
            else { icono(btnCamara, 'bi-camera-video-off-fill', 'Activar cámara', 'off'); }
        }
        if (btnPantalla) {
            if (lp.isScreenShareEnabled) { icono(btnPantalla, 'bi-display-fill', 'Dejar de compartir pantalla', 'on'); }
            else { icono(btnPantalla, 'bi-display', 'Compartir pantalla', ''); }
        }
    }

    function actualizarPaginador(totalPaginas, total) {
        if (!pager) { return; }
        pager.style.display = totalPaginas > 1 ? 'flex' : 'none';
        if (pagerInfo) { pagerInfo.textContent = 'Página ' + (paginaActual + 1) + ' de ' + totalPaginas; }
        if (btnPrev) { btnPrev.disabled = (paginaActual === 0); }
        if (btnNext) { btnNext.disabled = (paginaActual === totalPaginas - 1); }
        pager.setAttribute('aria-label', 'Página ' + (paginaActual + 1) + ' de ' + totalPaginas + ' · ' + total + ' participantes');
    }

    function pintar() {
        if (!room) { return; }

        var lista = todos();
        var total = lista.length;
        var totalPaginas = Math.max(1, Math.ceil(total / POR_PAGINA));
        if (paginaActual >= totalPaginas) { paginaActual = totalPaginas - 1; }
        if (paginaActual < 0) { paginaActual = 0; }

        var inicio = paginaActual * POR_PAGINA;
        var visibles = lista.slice(inicio, inicio + POR_PAGINA);

        contador.textContent = total + (total === 1 ? ' participante' : ' participantes');

        var presentes = {};
        visibles.forEach(function (p) { presentes[p.identity] = true; });
        Object.keys(tarjetas).forEach(function (id) { if (!presentes[id]) { quitarTarjeta(id); } });

        visibles.forEach(function (p) {
            var t = tarjetas[p.identity] || (tarjetas[p.identity] = crearTarjeta());
            actualizarTarjeta(p, t);
        });

        var deseado = visibles.map(function (p) { return tarjetas[p.identity].raiz; });
        var actual = Array.prototype.slice.call(grilla.children);
        var igual = deseado.length === actual.length && deseado.every(function (n, i) { return n === actual[i]; });
        if (!igual) {
            actual.forEach(function (n) { if (deseado.indexOf(n) === -1) { n.remove(); } });
            deseado.forEach(function (n) { grilla.appendChild(n); });
            visibles.forEach(function (p) { var t = tarjetas[p.identity]; if (t.camara) { t.video.play().catch(function () {}); } });
        }

        grilla.setAttribute('data-count', visibles.length);
        actualizarPaginador(totalPaginas, total);

        if (panel) { panel.textContent = ''; lista.forEach(function (p) { panel.appendChild(fila(p)); }); }
        if (tituloPanel) { tituloPanel.textContent = 'Participantes (' + total + ')'; }
        if (badge) { badge.textContent = total; }
        etiquetas();
    }

    function irPagina(n) {
        if (!room) { return; }
        var totalPaginas = Math.max(1, Math.ceil(todos().length / POR_PAGINA));
        if (n < 0) { n = 0; }
        if (n >= totalPaginas) { n = totalPaginas - 1; }
        paginaActual = n;
        ultimaNavManual = Date.now();
        pintar();
    }

    function seguirHablante() {
        if (!AUTO_SEGUIR_HABLANTE) { return; }
        if (Date.now() - ultimaNavManual < COOLDOWN_NAV_MS) { return; }
        var lista = todos();
        var inicio = paginaActual * POR_PAGINA;
        var fin = inicio + POR_PAGINA;
        for (var i = 0; i < lista.length; i++) {
            var p = lista[i];
            if (p === room.localParticipant) { continue; }
            if (p.isSpeaking && (i < inicio || i >= fin)) {
                paginaActual = Math.floor(i / POR_PAGINA);
                return;
            }
        }
    }

    if (btnPrev) { btnPrev.addEventListener('click', function () { irPagina(paginaActual - 1); }); }
    if (btnNext) { btnNext.addEventListener('click', function () { irPagina(paginaActual + 1); }); }

    fetch(sala.dataset.tokenUrl, { credentials: 'same-origin' })
        .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (d) {
                if (!r.ok) { throw new Error(d.detalle || 'No se pudo entrar a la clase.'); }
                return d;
            });
        })
        .then(function (d) {
            room = new LK.Room({ adaptiveStream: true, dynacast: true });
            ['ParticipantConnected', 'ParticipantDisconnected', 'TrackMuted', 'TrackUnmuted',
             'LocalTrackPublished', 'LocalTrackUnpublished', 'ParticipantMetadataChanged'].forEach(function (n) {
                room.on(LK.RoomEvent[n], pintar);
            });
            room.on(LK.RoomEvent.ActiveSpeakersChanged, function () {
                seguirHablante();
                pintar();
            });
            room.on(LK.RoomEvent.TrackSubscribed, function (track) {
                if (track.kind === LK.Track.Kind.Audio) { audios.appendChild(track.attach()); }
                else if (track.source === LK.Track.Source.ScreenShare) {
                    var v = track.attach(); v.setAttribute('playsinline', '');
                    pantalla.textContent = ''; pantalla.appendChild(v); pantalla.classList.remove('d-none');
                }
                pintar();
            });
            room.on(LK.RoomEvent.TrackUnsubscribed, function (track) {
                if (track.source === LK.Track.Source.Camera) { pintar(); return; }
                track.detach().forEach(function (e) { e.remove(); });
                if (track.source === LK.Track.Source.ScreenShare) { pantalla.classList.add('d-none'); pantalla.textContent = ''; }
                pintar();
            });
            room.on(LK.RoomEvent.AudioPlaybackStatusChanged, function () { btnAudio.classList.toggle('d-none', room.canPlaybackAudio); });
            room.on(LK.RoomEvent.Disconnected, function () {
                if (saliendo) { return; }
                estado.textContent = 'La clase terminó o se perdió la conexión'; estado.classList.remove('pill--ok');
                if (sala.dataset.finUrl) { setTimeout(function () { location.href = sala.dataset.finUrl; }, 2000); }
            });
            return room.connect(d.url, d.token);
        })
        .then(function () {
            estado.textContent = 'Audio activo'; estado.classList.add('pill--ok');
            [btnMic, btnCamara, btnPantalla].forEach(function (b) { if (b) { b.disabled = false; } });
            btnAudio.classList.toggle('d-none', room.canPlaybackAudio);
            pintar();
            if (puedeCompartir) {
                return room.localParticipant.setMicrophoneEnabled(true).catch(function () {
                    mostrarAviso('No se pudo usar el micrófono. Revisa los permisos del navegador.');
                });
            }
        })
        .then(pintar)
        .catch(function (e) { estado.textContent = 'No se pudo conectar'; mostrarAviso(e.message || 'No se pudo entrar a la clase.'); });

    btnAudio.addEventListener('click', function () { room.startAudio(); });
    if (btnMic) {
        btnMic.addEventListener('click', function () {
            var lp = room.localParticipant;
            lp.setMicrophoneEnabled(!lp.isMicrophoneEnabled).then(pintar)
                .catch(function () { mostrarAviso('No se pudo usar el micrófono. Revisa los permisos del navegador.'); });
        });
    }
    if (btnCamara) {
        btnCamara.addEventListener('click', function () {
            var lp = room.localParticipant;
            lp.setCameraEnabled(!lp.isCameraEnabled).then(pintar)
                .catch(function () { mostrarAviso('No se pudo usar la cámara. Revisa los permisos del navegador.'); });
        });
    }
    if (btnPantalla) {
        btnPantalla.addEventListener('click', function () {
            var lp = room.localParticipant;
            lp.setScreenShareEnabled(!lp.isScreenShareEnabled).then(pintar).catch(function () {});
        });
    }
    window.addEventListener('pagehide', function () {
        saliendo = true;
        if (room) { room.disconnect(); }
        if (sala.dataset.salirUrl && navigator.sendBeacon) {
            var f = new FormData(); f.append('csrfmiddlewaretoken', sala.dataset.csrf);
            navigator.sendBeacon(sala.dataset.salirUrl, f);
        }
    });
})();
</script>
