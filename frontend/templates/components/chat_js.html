{# Chat en tiempo real: conversación abierta (#chat) y lista de chats (bandeja). Si el WebSocket no está
   disponible, el formulario se envía normalmente y todo funciona al recargar. #}
<script>
(function () {
    var app = document.getElementById('chatApp');
    if (!app) { return; }
    var yo = parseInt(app.dataset.yo, 10);
    var cont = document.getElementById('chat');
    var lista = cont ? cont.querySelector('.chat-scroll') : null;
    var abiertaId = cont ? parseInt(cont.dataset.con, 10) : null;
    var listaConv = document.getElementById('listaConversaciones');
    var protocolo = location.protocol === 'https:' ? 'wss://' : 'ws://';

    function plano(t) { return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
    function el(tag, clase, texto) {
        var e = document.createElement(tag);
        if (clase) { e.className = clase; }
        if (texto !== undefined) { e.textContent = texto; }
        return e;
    }
    function conectar(ruta, alMensaje) {
        var c = { ws: null, abierto: false, intentos: 0 };
        (function abrir() {
            c.ws = new WebSocket(protocolo + location.host + ruta);
            c.ws.onopen = function () { c.abierto = true; c.intentos = 0; };
            c.ws.onmessage = function (e) { alMensaje(JSON.parse(e.data)); };
            c.ws.onclose = function () {
                c.abierto = false;
                if (c.intentos++ < 5) { setTimeout(abrir, 2000 * c.intentos); }
            };
        })();
        return c;
    }

    // --- Lista de chats: sube al principio y muestra el último mensaje
    function actualizarLista(id, nombre, iniciales, texto, sinLeer) {
        var vacio = listaConv.querySelector('.empty-state');
        if (vacio) { vacio.remove(); }
        var item = listaConv.querySelector('[data-id="' + id + '"]');
        if (!item) {
            item = el('a', 'conv-item');
            item.href = '?con=' + id; item.dataset.id = id; item.dataset.nombre = nombre;
            var av = el('span', 'avatar', iniciales); av.setAttribute('aria-hidden', 'true');
            var tx = el('span', 'conv-text');
            tx.appendChild(el('span', 'conv-name', nombre)); tx.appendChild(el('span', 'conv-last', ''));
            item.appendChild(av); item.appendChild(tx);
            if (id === abiertaId) { item.classList.add('is-selected'); }
        }
        item.querySelector('.conv-last').textContent = texto;
        if (sinLeer) {
            item.classList.add('is-unread');
            var n = item.querySelector('.conv-count');
            if (!n) { n = el('span', 'conv-count', '0'); item.appendChild(n); }
            n.textContent = String((parseInt(n.textContent, 10) || 0) + 1);
        }
        listaConv.insertBefore(item, listaConv.firstChild);
    }
    conectar(app.dataset.bandejaWs, function (d) {
        if (d.de_id !== abiertaId) { actualizarLista(d.de_id, d.nombre, d.iniciales, d.texto, true); }
    });

    // --- Conversación abierta
    if (cont) {
        var form = cont.querySelector('.composer'), caja = form.querySelector('textarea');
        var ultimoDia = cont.dataset.ultimoDia;
        var ajustar = function () { caja.style.height = 'auto'; caja.style.height = Math.min(caja.scrollHeight, 160) + 'px'; };
        var claveDia = function (f) {
            var m = f.getMonth() + 1, d = f.getDate();
            return f.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
        };
        var pintar = function (m) {
            var fecha = new Date(m.fecha), propio = m.emisor_id === yo;
            var vacio = lista.querySelector('.text-empty');
            if (vacio) { vacio.remove(); }
            if (claveDia(fecha) !== ultimoDia) { lista.appendChild(el('div', 'chat-day', 'Hoy')); ultimoDia = claveDia(fecha); }
            var fila = el('div', 'msg ' + (propio ? 'msg--out' : 'msg--in'));
            fila.appendChild(el('div', 'bubble ' + (propio ? 'bubble--out' : 'bubble--in'), m.texto));
            fila.appendChild(el('span', 'bubble-time', fecha.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })));
            lista.appendChild(fila);
            lista.scrollTop = lista.scrollHeight;
            actualizarLista(abiertaId, cont.dataset.nombre, cont.dataset.iniciales, (propio ? 'Tú: ' : '') + m.texto, false);
        };
        var chat = conectar(cont.dataset.ws, function (d) { if (d.error) { alert(d.error); } else { pintar(d); } });

        lista.scrollTop = lista.scrollHeight;
        caja.addEventListener('input', ajustar);
        caja.addEventListener('keydown', function (e) {   // Enter envía; Shift+Enter hace salto de línea
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                if (form.requestSubmit) { form.requestSubmit(); } else { form.submit(); }
            }
        });
        form.addEventListener('submit', function (e) {
            if (!chat.abierto) { return; }   // sin conexión en vivo: envío normal
            e.preventDefault();
            var texto = caja.value.trim();
            if (!texto) { return; }
            chat.ws.send(JSON.stringify({ texto: texto }));
            caja.value = ''; ajustar();
        });
        caja.focus();
    }

    // --- Buscadores (chats y nuevo chat)
    var filtroConv = document.getElementById('filtroConversaciones');
    filtroConv.addEventListener('input', function () {
        var q = plano(filtroConv.value.trim());
        listaConv.querySelectorAll('.conv-item').forEach(function (a) {
            a.classList.toggle('d-none', q !== '' && plano(a.dataset.nombre || '').indexOf(q) === -1);
        });
    });
    var modal = document.getElementById('modalNuevoChat');
    document.body.appendChild(modal);   // la barra fija no debe quedar por encima de la ventana
    var filtroContactos = document.getElementById('filtroContactos');
    filtroContactos.addEventListener('input', function () {
        var q = plano(filtroContactos.value.trim());
        modal.querySelectorAll('.contacto').forEach(function (a) {
            a.classList.toggle('d-none', q !== '' && plano(a.dataset.nombre).indexOf(q) === -1);
        });
        modal.querySelectorAll('.contactos-grupo').forEach(function (g) {
            g.classList.toggle('d-none', !g.querySelector('.contacto:not(.d-none)'));
        });
    });
    modal.addEventListener('shown.bs.modal', function () { filtroContactos.focus(); });
})();
</script>
