<header class="app-topbar">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
    </button>
    <a class="brand" href="#">
        <span class="logo-text">da | vinci</span>
        <div class="logo-sub">EDUCATIVO</div>
    </a>
    {% url 'admin_dashboard' as dash_url %}
    <form class="search-box" method="get" action="{{ search_url|default:dash_url }}" role="search">
        <input type="search" name="q" value="{{ q|default:'' }}" maxlength="100"
               placeholder="Buscar por nombre, correo, CI o código" aria-label="Buscar usuarios" autocomplete="off">
    </form>
    <div class="user-info">
        <a href="{% url 'perfil' %}" class="profile-link" title="Mi perfil">
            <div>
                <div class="user-name">{{ user_name|default:'Admin. Da Vinci' }}</div>
                <div class="user-role">{{ user_role|default:'Administrador' }}</div>
            </div>
            <div class="user-avatar">{{ initials|default:'AD' }}</div>
        </a>
        <a href="{% url 'logout' %}" class="btn-logout">Cerrar sesión</a>
    </div>
</header>
