name: Pruebas Da Vinci
run-name: Validación de pruebas y cobertura

on:
  push:
    branches: [ "main", "sprint-5" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Instalar dependencias
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Correr pruebas y generar reporte de cobertura
      working-directory: ./backend
      env:
        SECRET_KEY: 'test-secret-key-para-github-actions'
        DEBUG: 'True'
      run: |
        pytest -v \
          --cov=. \
          --cov-report=term-missing \
          --cov-report=html:htmlcov \
          --cov-report=xml:coverage.xml \
          tests/test_unit.py \
          tests/test_integration.py \
          tests/test_security.py

    - name: Guardar reporte de cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-cobertura
        path: |
          backend/htmlcov/
          backend/coverage.xml
        if-no-files-found: ignore